name: Shadow run of the clock-change fix (manual, read-only)

# ΧΕΙΡΟΚΙΝΗΤΟ και ΜΟΝΟ ΑΝΑΓΝΩΣΗΣ (permissions: contents: read). 4ο διαγνωστικό αλλαγής ώρας.
# Εφαρμόζει τον ΝΕΟ χειρισμό (scripts/clock_change.py) στα ΠΡΑΓΜΑΤΙΚΑ αρχεία ΑΔΜΗΕ παλιών αλλαγών ώρας και τυπώνει παλιό και νέο δίπλα-δίπλα.
# Το update_hydro.py ΔΕΝ αλλάζει (απόφαση D90): η εγκατάσταση γίνεται μετά τις 26/10/2026.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Ημερομηνίες χωρισμένες με κενό. Κενό = προεπιλογή: οι αλλαγές ώρας 2025 και 2026, η ημέρα μετά, και δύο κανονικές ημέρες'
        required: false
        default: ''
        type: string

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl xlrd

      - name: Shadow run on real files
        env:
          DATES: ${{ inputs.dates }}
        run: python scripts/diagnose_admie_dst_fix.py $DATES

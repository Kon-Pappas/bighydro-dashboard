name: Diagnose ADMIE RESMV on clock-change days (manual, read-only)

# ΧΕΙΡΟΚΙΝΗΤΟ και ΜΟΝΟ ΑΝΑΓΝΩΣΗΣ (permissions: contents: read). Διαγνωστικό για το K26 (RESMV τις ημέρες αλλαγής ώρας).
# Δείχνει τι επιστρέφει το API (μία ημέρα, εύρος, ευρύ εύρος), δοκιμάζει άμεση λήψη με βάση το όνομα και αναλύει κάθε αρχείο που βρίσκει.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Ημερομηνίες χωρισμένες με κενό. Κενό = προεπιλογή: οι έξι αλλαγές ώρας 2024–2026'
        required: false
        default: ''
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl xlrd

      - name: Diagnose RESMV
        env:
          DATES: ${{ inputs.dates }}
        run: python scripts/diagnose_admie_resmv.py $DATES

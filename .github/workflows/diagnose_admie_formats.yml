name: Diagnose ADMIE formats (manual, read-only)

# ΧΕΙΡΟΚΙΝΗΤΟ και ΜΟΝΟ ΑΝΑΓΝΩΣΗΣ (permissions: contents: read). 2ο διαγνωστικό ιστορικού ΑΔΜΗΕ.
# Τυπώνει τις ετικέτες των γραμμών των ΠΑΛΙΩΝ αρχείων (στάθμες και SCADA) και τα ΔΙΠΛΑ αρχεία, ώστε να γραφούν οι parsers του
# ιστορικού. Το αποτέλεσμα είναι στο log του run. Δεν γράφει τίποτα στο repo.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Ημερομηνίες-δείγματα χωρισμένες με κενό (π.χ. 2016-07-15 2018-07-15). Κενό = προεπιλογή: 15 Ιουλίου 2016, 2018, 2020, 2022, 2026'
        required: false
        default: ''
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl xlrd

      - name: Diagnose ADMIE formats
        env:
          DATES: ${{ inputs.dates }}
        run: python scripts/diagnose_admie_formats.py $DATES

name: Tests

# Τρέχει μόνο όταν αλλάζει κώδικας ή tests, ΟΧΙ στα καθημερινά commits δεδομένων.
# Μια αποτυχία εδώ δεν επηρεάζει την καθημερινή ενημέρωση δεδομένων.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'index.html'
      - 'tests/**'
      - 'data/reservoirs.json'
      - 'data/plant_heads.json'
      - 'data/energy_factors.json'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python tests/run_all.py

  page:
    name: Page tests (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tests/dashboard
      - run: node tests/dashboard/run.js

name: Daily BigHydro Fetcher

on:
  schedule:
    # 04:17 UTC = 07:17 ώρα Ελλάδας (μακριά από το μποτιλιάρισμα του API)
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-09-16). Κενό = τελευταίες 4 ημέρες'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-09-24). Κενό = μόνο η start_date'
        required: false
        type: string
      diagnose:
        description: 'Diagnose: τυπώνει τη δομή των αρχείων ADMIE/ENTSO-E για τη start_date (δεν γράφει JSON)'
        required: false
        type: boolean
        default: false

# Ένα run τη φορά, ώστε δύο εκτελέσεις να μη γράφουν ταυτόχρονα στο JSON
concurrency:
  group: bighydro-fetch
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl xlrd

      - name: Run Python script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          if [ "$DIAGNOSE" = "true" ]; then
            python scripts/update_hydro.py --diagnose
          else
            python scripts/update_hydro.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Fetcher"
          git add -A data
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή στα δεδομένα."
          else
            git commit -m "Auto-update hydro data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

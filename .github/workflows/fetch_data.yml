name: Daily BigHydro Fetcher

on:
  schedule:
    # 04:17 UTC = 07:17 Ώρα Ελλάδος (Μακριά από το μποτιλιάρισμα του API)
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-09-20)'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-09-30)'
        required: false
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd

      - name: Run Python script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python scripts/update_hydro.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Fetcher"
          git add data/hydro_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update hydro data" && git push)
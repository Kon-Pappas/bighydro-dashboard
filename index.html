<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigHydro · Υδροηλεκτρικά ανά ποταμό</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mut:#5b6773;--line:#dfe3e8;--c1:#2f6fb5;--c2:#d9822b;--c3:#2e9b7a;--bar:#dbe7f5;--warn:#b36b00;--warnbg:#fff4e0;--bad:#b3261e;--shade:rgba(47,111,181,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mut:#9aa7b4;--line:#2a3541;--c1:#6aa6e8;--c2:#f0a35a;--c3:#5ccaa5;--bar:#25374d;--warn:#f0b35a;--warnbg:#3a2d12;--bad:#ff8a80;--shade:rgba(106,166,232,.10)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 40px}
header.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px 0 6px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--c1)}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 14px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap}
nav.tabs button.on{border-bottom-color:var(--c1);color:var(--c1);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .lab{font-size:12px;color:var(--mut)}
.card .val{font-size:22px;font-weight:600;margin-top:2px}
.card .sm{font-size:12px;color:var(--mut);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.river{text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.river h3{margin:0 0 4px;font-size:15px}
.big{font-size:24px;font-weight:600}
.track{height:7px;background:var(--bar);border-radius:4px;margin:6px 0 8px;overflow:hidden}
.fillb{height:100%;background:var(--c1);border-radius:4px}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mut{color:var(--mut)}.small{font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.note{font-size:12px;color:var(--mut);margin:10px 0}
#banner .b{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mut);font-size:11px}
svg.ch .ax{stroke:var(--line)}
.s1{stroke:var(--c1);fill:none;stroke-width:2}.s2{stroke:var(--c2);fill:none;stroke-width:2}.s3{stroke:var(--c3);fill:none;stroke-width:2}
.b1{fill:var(--c1)}.b2{fill:var(--c2)}.b3{fill:var(--c3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-b{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px;z-index:10}
.modal-b[hidden]{display:none}
.modal{background:var(--bg);border-radius:14px;max-width:760px;width:100%;padding:16px 16px 20px;border:1px solid var(--line)}
.modal .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal h2{margin:0;font-size:18px}
.dam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.2fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.flow{text-align:center;color:var(--mut);font-size:13px;line-height:1.2;padding:2px 0}
.pump{color:var(--warn)}
@media (max-width:560px){.dam{grid-template-columns:1fr}.dam>div:last-child{text-align:left!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="ctrl"><label class="small mut" id="dlab" for="dsel"></label><select id="dsel"></select><button id="lang"></button><button id="meth"></button></div>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="banner"></div>
<main>
  <section id="t-rivers"><div class="cards" id="sum"></div><div class="grid" id="rg"></div><p class="note" id="rfoot"></p></section>
  <section id="t-energy" hidden></section>
  <section id="t-kast" hidden></section>
</main>
</div>
<div class="modal-b" id="rm" hidden><div class="modal" id="rmc"></div></div>
<div class="modal-b" id="mm" hidden><div class="modal" id="mmc"></div></div>

 m:['<b>Πηγές.</b> ΑΔΜΗΕ: Reservoir Filling Rate (στάθμες, μέτρηση 00:00), SCADA (πραγματική παραγωγή), ISP (πρόγραμμα αγοράς), RESMV (μικρά υδροηλεκτρικά). ENTSO-E: τιμή αγοράς και εβδομαδιαίο απόθεμα (16.1.D).',
 '<b>Ώρα.</b> Όλα τα ωριαία είναι σε ώρα Ελλάδας (H01 = 00:00–01:00). Το SCADA και το RESMV δημοσιεύονται έτσι. Το ISP και η τιμή δημοσιεύονται σε ώρα αγοράς (CET) και μετατοπίζονται κατά +1 ώρα (επαληθεύτηκε σε δεδομένα Ιουνίου–Οκτωβρίου 2026).',

function getJSON(p){if(cache[p])return Promise.resolve(cache[p]);return fetch('data/'+p).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.json()}).then(function(j){cache[p]=j;return j})}
function opt(p){return getJSON(p).catch(function(){return null})}
function cap(k){return P.meta.Reservoirs[k].CapacityHm3}
function sanitize(){
  var keys=Object.keys(P.meta.Reservoirs),dates=P.hist.map(function(r){return r.Date}),fill=P.hist.map(function(r){var o={};for(var k in r.Reservoir)o[k]=r.Reservoir[k];return o});
  P.notes=[];
  keys.forEach(function(k){
    if(cap(k)<100)return;
    var i=0;
    while(i<fill.length){
      if(fill[i][k]===0){var j=i;while(j<fill.length&&fill[j][k]===0)j++;var a=i-1,b=j;

  $('#tabs').innerHTML=['rivers','energy','kast'].map(function(k){return '<button data-t="'+k+'" class="'+(S.tab===k?'on':'')+'">'+t('t_'+k)+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');chrome();showTab()}});
  var sel=$('#dsel'),cur=S.date;sel.innerHTML=P.idx.Days.map(function(x){var ok=x.Status&&x.Status.scada==='ok';return '<option value="'+x.Date+'"'+(x.Date===cur?' selected':'')+'>'+fd(x.Date)+(ok?'':' *')+'</option>'}).join('')}
function showTab(){['rivers','energy','kast'].forEach(function(k){$('#t-'+k).hidden=S.tab!==k})}
function load(date){
  S.date=date;
  return getJSON('days/'+date+'.json').catch(function(){return null}).then(function(rec){
    S.rec=rec||{Hourly:[]};S.M=model(date,S.rec);banner();cardsSummary(S.M,S.rec);cardsRivers(S.M);$('#rfoot').textContent=t('click');renderEnergy();renderKast();renderMeth();chrome();showTab()})}

function boot(){
  Promise.all([getJSON('index.json'),getJSON('reservoirs.json'),getJSON('energy_factors.json'),getJSON('reservoir_history.json'),opt('plant_heads.json'),opt('entsoe_reservoir.json')]).then(function(a){
    P.idx=a[0];P.meta=a[1];P.fac=a[2];P.hist=a[3];P.heads=a[4];P.ent=a[5];sanitize();physE();
    var pick=P.idx.Days.filter(function(x){return x.Status&&x.Status.scada==='ok'&&x.Status.isp==='ok'})[0]||P.idx.Days[0];
    $('#dsel').onchange=function(){load(this.value)};
    $('#lang').onclick=function(){S.lang=S.lang==='el'?'en':'el';try{localStorage.setItem('bh_lang',S.lang)}catch(e){}load(S.date)};
    $('#meth').onclick=function(){$('#mm').hidden=false};
    $('#rm').onclick=function(e){if(e.target===this)this.hidden=true};$('#mm').onclick=function(e){if(e.target===this)this.hidden=true};
    return load(pick.Date)}).catch(function(e){document.querySelector('main').innerHTML='<div class="panel">'+t('err')+'<br><span class="mut small">'+(e&&e.message||e)+'</span></div>';if(window.console)console.error(e)})}
window.__bh={P:P,S:S,model:model,eqE:eqE,boot:boot,load:load,openRiver:openRiver};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>

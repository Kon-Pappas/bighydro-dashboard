<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigHydro · Υδροηλεκτρικά ανά ποταμό</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mut:#5b6773;--line:#dfe3e8;--c1:#2f6fb5;--c2:#d9822b;--c3:#2e9b7a;--bar:#dbe7f5;--warn:#b36b00;--warnbg:#fff4e0;--bad:#b3261e;--shade:rgba(47,111,181,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mut:#9aa7b4;--line:#2a3541;--c1:#6aa6e8;--c2:#f0a35a;--c3:#5ccaa5;--bar:#25374d;--warn:#f0b35a;--warnbg:#3a2d12;--bad:#ff8a80;--shade:rgba(106,166,232,.10)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 40px}
header.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px 0 6px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--c1)}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 14px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap}
nav.tabs button.on{border-bottom-color:var(--c1);color:var(--c1);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.seg button.on{border-color:var(--c1);color:var(--c1);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .lab{font-size:12px;color:var(--mut)}
.card .val{font-size:22px;font-weight:600;margin-top:2px}
.card .sm{font-size:12px;color:var(--mut);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.river{text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.river h3{margin:0 0 4px;font-size:15px}
.big{font-size:24px;font-weight:600}
.track{height:7px;background:var(--bar);border-radius:4px;margin:6px 0 8px;overflow:hidden}
.fillb{height:100%;background:var(--c1);border-radius:4px}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mut{color:var(--mut)}.small{font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.note{font-size:12px;color:var(--mut);margin:10px 0}
#banner .b{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mut);font-size:11px}
svg.ch .ax{stroke:var(--line)}
.s1{stroke:var(--c1);fill:none;stroke-width:2}.s2{stroke:var(--c2);fill:none;stroke-width:2}.s3{stroke:var(--c3);fill:none;stroke-width:2}
.s1l,.s2l{fill:none;stroke-width:1;opacity:.35}.s1l{stroke:var(--c1)}.s2l{stroke:var(--c2)}
.b1{fill:var(--c1)}.b2{fill:var(--c2)}.b3{fill:var(--c3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-b{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px;z-index:10}
.modal-b[hidden]{display:none}
.modal{background:var(--bg);border-radius:14px;max-width:760px;width:100%;padding:16px 16px 20px;border:1px solid var(--line)}
.modal .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal h2{margin:0;font-size:18px}
.dam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.2fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.flow{text-align:center;color:var(--mut);font-size:13px;line-height:1.2;padding:2px 0}
.pump{color:var(--warn)}
@media (max-width:560px){.dam{grid-template-columns:1fr}.dam>div:last-child{text-align:left!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="ctrl"><label class="small mut" id="dlab" for="dsel"></label><select id="dsel"></select><button id="lang"></button><button id="meth"></button></div>

<div id="banner"></div>

</div>
<div class="modal-b" id="rm" hidden><div class="modal" id="rmc"></div></div>
<div class="modal-b" id="mm" hidden><div class="modal" id="mmc"></div></div>

m³)',w_th_dv:'Δ αποθέματος',w_th_q:'Στροβιλισμός Στράτου',w_th_n:'Σύνολο (καθαρή)',w_th_g:'Σύνολο (μικτή)',w_n1:'Φαινόμενη εισροή = μεταβολή αποθέματος + νερό που στροβιλίστηκε − νερό που ήρθε από τον ανάντη σταθμό. Είναι φυσική εισροή μείον όσα δεν μετράμε (αρδεύσεις, εξάτμιση, υπερχειλίσεις, οικολογική παροχή). Δεν είναι μέτρηση ροής.',w_n2:'Στο Καστράκι πέφτει ο Ίναχος (πληροφορία χρήστη), άρα θετική ενδιάμεση εισροή είναι αναμενόμενη. Δεν εξαφανίζεται με καμία εύλογη αλλαγή των πτώσεων: στα δεδομένα Ιανουαρίου–Οκτωβρίου το Καστράκι στροβιλίζει τουλάχιστον 14% περισσότερο νερό από τα Κρεμαστά. Η τιμή του Καστρακίου περιλαμβάνει όμως και ό,τι φτάνει από τα Κρεμαστά χωρίς να περάσει από στρόβιλο, άρα δεν μπορεί να διαβαστεί ως μόνο Ίναχος.',w_n3:'Οι αρνητικές τιμές του καλοκαιριού (Κρεμαστά Αύγουστος–Οκτώβριος, Στράτος Ιούνιος–Σεπτέμβριος) σημαίνουν ότι λήψεις και απώλειες ξεπερνούν τη φυσική εισροή. Ενδεικτικά, το PDF Στεφανάκου (διαφάνεια 30) δίνει 544 hm³ τον χρόνο για αρδεύσεις από τους ταμιευτήρες του Αχελώου (2005).',w_n4:'Όταν ξεκινήσει η ΑΑΣ Αμφιλοχίας (Καστράκι ως κάτω ταμιευτήρας), το νερό που θα ανεβαίνει στους άνω ταμιευτήρες θα φαίνεται ως αρνητικός όρος στο Καστράκι.',w_n5:'Συντελεστές: καθαρή και μικτή πτώση από μη επίσημα έγγραφα. Ο Στράτος ΙΙ δεν μπαίνει στον όγκο. Ο όγκος του Καστρακίου είναι αβέβαιος πάνω από το 100%.',w_a1:'Η άντληση Ασώματα → Σφηκιά μετακινεί νερό μέσα στον καταρράκτη και αφαιρείται από το ισοζύγιο του ποταμού. Γι\' αυτό η Σφηκιά και τα Ασώματα εμφανίζονται ως ένα σύνολο και ο όγκος άντλησης, που δεν μετράται, δεν χρειάζεται.',w_a2:'Ο Ιλαρίων είναι σε βλάβη (πληροφορία χρήστη) και στα δεδομένα Ιουνίου–Οκτωβρίου 2026 στροβιλίζει μόνο σε σύντομες ώρες. Όσο δεν στροβιλίζει, το νερό που τον διαβαίνει (υπερχειλιστής, παρακαμπτήριος) δεν μετριέται και εμφανίζεται στον Πολύφυτο, άρα η διάσπαση Ιλαρίων/Πολύφυτο δεν είναι αξιόπιστη μέχρι να επανέλθει σε λειτουργία. Το άθροισμα των δύο και το σύνολο του ποταμού δεν επηρεάζονται.',w_a3:'Η  '<b>Καστράκι πάνω από 100%.</b> Συνηθισμένο φαινόμενο, δεν αντιμετωπίζεται ως ανωμαλία. Δείτε την καρτέλα «Καστράκι».',
 '<b>Ισοδύναμο ENTSO-E.</b> Κάθε hm³ αξίζει όσο παράγει καθώς κατεβαίνει τον καταρράκτη. Οι συντελεστές εκτιμήθηκαν με μη αρνητικά ελάχιστα τετράγωνα πάνω στα εβδομαδιαία ENTSO-E 2026· η εβδομάδα ENTSO-E ισούται με τον μέσο όρο των ημερήσιων τιμών τέλους ημέρας. Σφάλμα στο σύνολο ~0,17% (leave-one-out). Ανά ποταμό η αβεβαιότητα είναι ±10–20% και ανά φράγμα δεν δίνεται (οι ταμιευτήρες ενός καταρράκτη κινούνται μαζί).',
 '<b>Φυσική εκτίμηση.</b> 2,725 × μικτή πτώση × απόδοση, με τιμές από μη επίσημα έγγραφα που δεν έχουν επαληθευτεί. Συμφωνεί με το ENTSO-E για Κρεμαστά, Καστράκι, Πολύφυτο, Θησαυρό και Πλαστήρα, όχι όμως για τις Πηγές Αώου.',
 '<b>Πηγές Αώου.</b> Η φυσική αξία (~1.850 MWh/hm³ με Πουρνάρι, περίπου 10% του συνόλου) δεν φαίνεται στη σειρά ENTSO-E· στα δεδομένα Ιανουαρίου–Σεπτεμβρίου η αξία του Αώου βγαίνει 0–200 MWh/hm³. Δεν γνωρίζουμε αν ο ΑΔΜΗΕ τον αποτιμά διαφορετικά.',
 '<b>Ποιότητα δεδομένων.</b> Ο Ιλαρίων εμφανίστηκε στο 0,00% από 19 έως 25/7/2026 (63 hm³)· οι τιμές 0,00% σε μεγάλους ταμιευτήρες θεωρούνται άκυρες και αντικαθίστανται με παρεμβολή στους υπολογισμούς ενέργειας.',
 '<b>Υδροηλεκτρικά: ομάδες.</b> Μεγάλα ΥΗΕ: 16 μονάδες (SCADA και ISP). Μικρά ΔΕΗ: Στράτος ΙΙ, Μακροχώρι, Λούρος, Γκιώνα (SCADA, ίδιο μπλοκ, μέσα στο TOTAL HYDRO, όχι στο ISP). Μικρά Μέσης Τάσης: ένα άθροισμα από το αρχείο RESMV (μη πιστοποιημένες μετρήσεις, εκτίμηση). Επιπλέον η γραμμή «ΑΥΛΑΚΙ (ΜΥΗΣ)» του μπλοκ ΑΝΑΝΕΩΣΙΜΑ του SCADA, που δεν ανήκει στο TOTAL HYDRO. Η «ορατή» παραγωγή είναι το άθροισμα όλων αυτών. Τα άλλα 7 μικρά της ΔΕΗ που αναφέρει το PDF του Στεφανάκου (Γλαύκος, Βέρμιο, Αγία και Άλμυρος Κρήτης, Αγ. Ιωάννης Σερρών, Αγ. Βαρβάρα, Σμόκοβο) δεν εμφανίζονται ως γραμμές στο SCADA.',
 '<b>Ισοζύγιο νερού (Αχελώος, Αλιάκμονας).</b> Στον Αλιάκμονα η Σφηκιά ενώνεται με τα Ασώματα, ώστε η άντληση να μην επηρεάζει το αποτέλεσμα. Ο Ιλαρίων είναι σε βλάβη και μένει ξεχωριστός, με την επισήμανση ότι η διάσπασή του από τον Πολύφυτο δεν είναι αξιόπιστη όσο δεν στροβιλίζει. Φαινόμενη εισροή ανά ομάδα φραγμάτων = μεταβολή αποθέματος + νερό που στροβιλίστηκε (παραγωγή SCADA διά ενέργεια ανά hm³) − νερό από τον ανάντη σταθμό. Περιλαμβάνει όσα δεν μετράμε (αρδεύσεις, εξάτμιση, υπερχειλίσεις), άρα δεν είναι μέτρηση ροής. Δίνονται δύο εκδοχές συντελεστών (καθαρή και μικτή πτώση) ως ένδειξη αβεβαιότητας.',
 '<b>Άντληση.</b> Το SCADA δίνει μόνο το σύνολο άντλησης (και το ENTSO-E το ίδιο). Ανά μονάδα (Σφηκιά, Θησαυρός) υπάρχει μόνο το πρόγραμμα ISP. Η εκτίμηση μοιράζει κάθε ώρα το σύνολο του SCADA με βάση το πρόγραμμα ISP της ώρας· ώρες χωρίς πρόγραμμα παίρνουν το μερίδιο της ημέρας· ημέρες χωρίς πρόγραμμα δεν μοιράζονται. Είναι εκτίμηση και όχι μέτρηση.',
 '<b>Όρια.</b> Η αντλία Πλατανόβρυση → Θησαυρός είναι υπόθεση. Ο Στράτος ΙΙ προστίθεται στον Στράτο Ι μόνο για μέρες με δεδομένα SCADA ανά μονάδα. Οι συντελεστές θα επανεκτιμηθούν με φθινοπωρινή πλήρωση.']},

+ water turbined − water arriving from the upstream plant. It is natural inflow minus whatever we do not measure (irrigation, evaporation, spills, environmental flow). It is not a flow measurement.',w_n2:'The Inachos river flows into Kastraki (user information), so a positive intermediate inflow is expected. It does not disappear under any plausible change of heads: on January-October data Kastraki turbines at least 14% more water than Kremasta. The Kastraki value also includes anything arriving from Kremasta without passing through a turbine, so it cannot be read as Inachos alone.',w_n3:'Negative summer values (Kremasta August-October, Stratos June-September) mean withdrawals and losses exceed natural inflow. For scale, the Stefanakos PDF (slide 30) gives 544 hm³ per year for irrigation from the Acheloos reservoirs (2005).',w_n4:'When the Amfilochia pumped storage starts (Kastraki as lower reservoir), the water pumped to the upper reservoirs will show up as a negative term at Kastraki.',w_n5:'Factors: net and gross head from unofficial documents. Stratos II is not included in the volume. Kastraki volume is uncertain above 100%.',w_a1:'The Asomata → Sfikia pump moves water inside the cascade and drops out of the river balance. That is why Sfikia and Asomata are shown as one block and the pumped volume, which is not measured, is not needed.',w_a2:'Ilarionas is out of service (user information) and in the June-October 2026 data it turbines only in short hours. While it does not turbine, the water passing it (spillway, bypass) is not measured and shows up at Polyfyto, so the Ilarionas/Polyfyto split is not reliable until it is back in service. Their sum and the river total are not affected.',w_a3:'The lower basin is negative all year: Asomata turbines {x}% of the water Polyfyto turbines. The rest may be spills, bypasses or withdrawals (irrigation), or an overestimate of Asomata water. Its size depends on the Asomata head, which is an estimate (net ~44 m; it would vanish at ~31 m).',p_note:'The per-plant split is made hour by hour using the ISP schedule (about 91% of the energy); hours without a schedule take the day share ({d}%); days with no schedule at all are not split ({u}%). It is an estimate, not a measurement. "No schedule" and "not delivered" are energy in hours where ISP or SCADA shows zero.',

 m_title:'Methodology and limitations',
 m:['<b>Sources.</b> ADMIE: Reservoir Filling Rate (levels, 00:00 reading), SCADA (actual output), ISP (market schedule), RESMV (small hydro). ENTSO-E: day-ahead price and weekly reservoir stock (16.1.D).',
 '<b>Time.</b> All hourly data use Greek time (H01 = 00:00-01:00). SCADA and RESMV are published that way. ISP and price are published on market (CET) time and shifted by +1 h (verified on June-October 2026 data).',
 '<b>Fill level.</b> Percentages per reservoir are ADMIE\'s. Volume = percentage × useful capacity (PPC, Stefanakos 2020). The official total is volume-weighted; our rebuild comes out ~1 percentage point lower on average (possibly a different volume for one reservoir, e.g. Ilarionas).',
 '<b>Kastraki above 100%.</b> Common behaviour, not treated as an anomaly. See the Kastraki tab.',
 '<b>ENTSO-E equivalent.</b> Each hm³ is worth what it generates while descending the cascade. Factors were estimated by non-negative least squares on ENTSO-E weekly values of 2026; an ENTSO-E week equals the mean of daily end-of-day values. Error on the total ~0.17% (leave-one-out). Per river the uncertainty is ±10-20%; per dam it is not shown (reservoirs in a cascade move together).',
 '<b>Physical estimate.</b> 2.725 × gross head × efficiency, with values from unofficial documents that have not been verified. It agrees with ENTSO-E for Kremasta, Kastraki, Polyfyto, Thesavros and Plastiras, but not for Pigai Aoou.',
 '<b>Pigai Aoou.</b> Its physical value (~1,850 MWh/hm³ including Pournari, about 10% of the total) is not visible in the ENTSO-E series; on January-September data its value comes out at 0-200 MWh/hm³. We do not know whether ADMIE values it differently.',
 '<b>Data quality.</b> Ilarionas showed 0.00% from 19 to 25 July 2026 (63 hm³); 0.00% readings in large reservoirs are treated as invalid and replaced by interpolation in the energy calculations.',
 '<b>Hydro groups.</b> Large hydro: 16 units (SCADA and ISP). Small PPC: Stratos II, Makrochori, Louros, Gkiona (SCADA, same block, included in TOTAL HYDRO, not in ISP). Small medium-voltage: one total from the RESMV file (uncertified measurements, estimate). Plus the "ΑΥΛΑΚΙ (ΜΥΗΣ)" row of the SCADA renewables block, which is not part of TOTAL HYDRO. "Visible" generation is the sum of all of these. The other 7 small PPC plants named in the Stefanakos PDF (Glafkos, Vermio, Agia and Almyros in Crete, Ag. Ioannis Serron, Ag. Varvara, Smokovo) do not appear as rows in SCADA.',
 '<b>Water balance (Acheloos, Aliakmon).</b> On the Aliakmon, Sfikia is merged with Asomata so that pumping does not affect the result. Ilarionas is out of service and stays separate, noting that its split from Polyfyto is not reliable while it does not turbine. Apparent inflow per group of dams = storage change + water turbined (SCADA output divided by energy per hm³) − water from the upstream plant. It includes what we do not measure (irrigation, evaporation, spills), so it is not a flow measurement. Two factor sets (net and gross head) are shown as an indication of uncertainty.',
 '<b>Pumping.</b> SCADA only reports total pumping (and so does ENTSO-E). Per plant (Sfikia, Thesavros) only the ISP schedule exists. The estimate splits the SCADA total each hour using that hour\'s ISP schedule; hours without a schedule take the day share; days without any schedule are not split. It is an estimate, not a measurement.',
 '<b>Limits.</b> The Platanovrysi → Thesavros pump is an assumption. Stratos II is added to Stratos I only for days with per-unit SCADA data. Factors will be re-estimated with autumn filling.']}};

function t(k,v){var s=(T[S.lang]&&T[S.lang][k]!=null?T[S.lang][k]:T.el[k]);if(typeof s!=='string')return s;if(v)for(var x in v)s=s.replace('{'+x+'}',v[x]);return s}
function nf(v,d){if(v==null||isNaN(v))return '—';d=d||0;return v.toLocaleString(S.lang==='el'?'el-GR':'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d})}
function sg(v,d){return v==null||isNaN(v)?'—':(v>0?'+':'')+nf(v,d)}
function fd(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dn(s){return Date.parse(s+'T00:00:00Z')/86400000}
function addDays(s,n){return new Date(Date.parse(s+'T00:00:00Z')+n*86400000).toISOString().slice(0,10)}
function rname(r){return S.lang==='el'?r.Name:(RN[r.Id]||r.Name)}
function dname(k){return S.lang==='el'?P.meta.Reservoirs[k].NameEl:(DN[k]||k)}

/* ---------- data ---------- */
function getJSON(p){if(cache[p])return Promise.resolve(cache[p]);return fetch('data/'+p).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.json()}).then(function(j){cache[p]=j;return j})}
function opt(p){return getJSON(p).catch(function(){return null})}
function cap(k){return P.meta.Reservoirs[k].CapacityHm3}
function sanitize(){
  var keys=Object.keys(P.meta.Reservoirs),dates=P.hist.map(function(r){return r.Date}),fill=P.hist.map(function(r){var o={};for(var k in r.Reservoir)o[k]=r.Reservoir[k];return o});
  P.notes=[];
  keys.forEach(function(k){
    if(cap(k)<100)return;
    var i=0;
    while(i<fill.length){
      if(fill[i][k]===0){var j=i;while(j<fill.length&&fill[j][k]===0)j++;var a=i-1,b=j;
        if(a>=0&&b<fill.length){var va=fill[a][k],vb=fill[b][k];for(var q=i;q<j;q++)fill[q][k]=va+(vb-va)*(q-a)/(b-a)}
        P.notes.push({key:k,from:dates[i],to:dates[j-1],days:j-i});i=j}
      else i++}});
  P.dates=dates;P.fill=fill;P.fi={};dates.forEach(function(d,i){P.fi[d]=i});
}
function vol(i,k){return P.fill[i][k]/100*cap(k)}
function physE(){
  var E={},H=P.heads&&P.heads.Plants||{};
  P.meta.Rivers.forEach(function(r){
    var kk=r.Order.map(function(k){var h=H[k];return h?2.725*h.GrossHeadM*(h.EtaMin+h.EtaMax)/2:0});
    r.Order.forEach(function(k,p){var s=0;for(var q=p;q<kk.length;q++)s+=kk[q];E[k]=s})});
  P.ePhys=E}
function eqE(i){var s=0,F=P.fac.Factors;for(var k in F)s+=F[k].EnergyMWhPerHm3*vol(i,k);return s/1000}
function riverE(i,r,which){var s=0;r.Order.forEach(function(k){var e=which==='phys'?P.ePhys[k]:P.fac.Factors[k].EnergyMWhPerHm3;s+=e*vol(i,k)});return s/1000}
function sumKey(rec,key){if(!rec||!rec.Hourly)return null;var s=0,n=0;rec.Hourly.forEach(function(h){if(h[key]!=null){s+=h[key];n++}});return n?s:null}
function hourly(rec,units,pre){var a=[];for(var h=0;h<24;h++){var s=0,any=false;units.forEach(function(u){var v=rec.Hourly&&rec.Hourly[h]&&rec.Hourly[h][pre+u];if(v!=null){s+=v;any=true}});a.push(any?s:null)}return a}

/* ---------- model for selected day ---------- */
function model(date,rec){
  var i=P.fi[date],inx=P.fi[addDays(date,1)],M={i:i,rivers:[]};
  P.meta.Rivers.forEach(function(r){
    var R={r:r,dams:[],prod:0,prodN:0,isp:0,vol:0,cap:0,fillV:0};
    r.Order.forEach(function(k){
      var m=P.meta.Reservoirs[k],v=vol(i,k),dv=inx!=null?vol(inx,k)-v:null,pr=0,pn=0,ip=0;
      m.Units.forEach(function(u){var s=sumKey(rec,'SCADA_'+u);if(s!=null){pr+=s;pn++}var q=sumKey(rec,'ISP_'+u);if(q!=null)ip+=q});
      R.dams.push({k:k,fill:P.fill[i][k],cap:m.CapacityHm3,v:v,dv:dv,prod:pn?pr:null,isp:ip,units:m.Units});
      R.vol+=v;R.cap+=m.CapacityHm3;R.prod+=pr;R.prodN+=pn;R.isp+=ip});
    R.fill=R.vol/R.cap*100;R.eEq=riverE(i,r,'eq');R.ePh=riverE(i,r,'phys');
    M.rivers.push(R)});
  var nr=(P.meta.WithoutReservoir||[]).map(function(w){var s=0,n=0;w.Units.forEach(function(u){var v=sumKey(rec,'SCADA_'+u);if(v!=null){s+=v;n++}});return{name:w.Name,prod:n?s:null}});
  M.noRes=nr.length?[{name:nr.map(function(x){return x.name}).join(' / '),parts:nr,prod:nr.some(function(x){return x.prod!=null})?nr.reduce(function(a,x){return a+(x.prod||0)},0):null}]:[];
  M.aoosPh=P.ePhys.P_AOOU*vol(i,'P_AOOU')/1000;
  M.eqTotal=eqE(i);M.phTotal=M.rivers.reduce(function(a,R){return a+R.ePh},0);
  return M}

/* ---------- charts (inline SVG) ---------- */
function ticks(lo,hi,n){var span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/step;step*=e>=5?5:e>=2?2:1;var a=Math.floor(lo/step)*step,o=[];for(var v=a;v<=hi+step*0.001;v+=step)o.push(+v.toFixed(10));return o}
function chart(o){
  var W=o.w||680,H=o.h||250,L=76,R=12,Tp=12,B=28,pw=W-L-R,ph=H-Tp-B,xs=[],ys=[];
  o.series.forEach(function(s){s.pts.forEach(function(p){if(p[1]!=null){xs.push(p[0]);ys.push(p[1])}})});
  (o.hlines||[]).forEach(function(h){ys.push(h.y)});
  var x0=o.x0!=null?o.x0:Math.min.apply(null,xs),x1=o.x1!=null?o.x1:Math.max.apply(null,xs);
  var y0=o.y0!=null?o.y0:Math.min.apply(null,ys),y1=o.y1!=null?o.y1:Math.max.apply(null,ys);
  var pad=(y1-y0)*0.06||1;if(o.y0==null)y0-=pad;if(o.y1==null)y1+=pad;if(o.zero){y0=Math.min(y0,0);y1=Math.max(y1,0)}
  var X=function(x){return L+(x-x0)/((x1-x0)||1)*pw},Y=function(y){return Tp+(1-(y-y0)/((y1-y0)||1))*ph},g='';

  var x0=dn(D[0].Date),x1=dn(D[D.length-1].Date),pts=function(f){return D.map(function(x){return [dn(x.Date),f(x)*C]})};
  var cfg=function(series){return {w:680,h:240,x0:x0,x1:x1,zero:true,yf:function(v){return nf(v)},xt:monthTicks(x0,x1),vline:dn(S.date),series:series}};
  h+='<div class="panel"><h2>'+t('w_title_'+rid)+'</h2><h2 style="font-weight:500;font-size:13px;color:var(--mut)">'+t('w_c_river')+'</h2>'+chart(cfg([{cls:'s1',pts:ma(pts(function(x){return x.Rivern}),7)},{cls:'s2',pts:ma(pts(function(x){return x.Riverg}),7)}]))+legend([['var(--c1)',t('w_lg_n')],['var(--c2)',t('w_lg_g')]])+'</div>';
  h+='<div class="panel"><h2>'+t('w_c_dam')+'</h2>'+chart(cfg(G.map(function(g,i){return {cls:COL[i],pts:ma(pts(function(x){return x.Inn[i]}),7)}})))+legend(G.map(function(g,i){return [CV[i],lbl(g)]}))+'</div>';
  var mo={};D.forEach(function(x){var m=x.Date.slice(0,7),a=mo[m]||(mo[m]={dv:0,q:0,g:G.map(function(){return 0}),n:0,gg:0});a.dv+=sm(x.dV);a.q+=x.Qn[n-1];x.Inn.forEach(function(v,i){a.g[i]+=v});a.n+=x.Rivern;a.gg+=x.Riverg});
  h+='<div class="panel"><h2>'+t('w_month')+'</h2><div class="scroll"><table><tr><th>'+t('th_month')+'</th><th>'+t('w_th_dv')+'</th><th>'+t('w_q')+'</th>'+G.map(function(g){return '<th>'+lbl(g)+'</th>'}).join('')+'<th>'+t('w_th_n')+'</th><th>'+t('w_th_g')+'</th></tr>'+
   Object.keys(mo).sort().map(function(m){var a=mo[m];return '<tr><td>'+m+'</td><td>'+sg(a.dv,0)+'</td><td>'+nf(a.q,0)+'</td>'+a.g.map(function(v){return '<td>'+sg(v,0)+'</td>'}).join('')+'<td><b>'+sg(a.n,0)+'</b></td><td>'+sg(a.gg,0)+'</td></tr>'}).join('')+'</table></div></div>';
  var qa=D.reduce(function(a,x){return a+x.Qn[Math.max(0,n-2)]},0),qb=D.reduce(function(a,x){return a+x.Qn[n-1]},0),keys=rid==='acheloos'?['w_n1','w_n2','w_n3','w_n4','w_n5']:['w_n1','w_a1','w_a2','w_a3','w_n5'];
  h+=keys.map(function(k){return '<p class="note">'+t(k,{x:nf(qa>0?qb/qa*100:0,0)})+'</p>'}).join('');
  el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.seg button'),function(b){b.onclick=function(){S.wbRiver=b.getAttribute('data-r');renderWB()}})}
function renderKast(){
  var k='KASTRAKI',fl=P.fill.map(function(f){return f[k]}),n=fl.length,pts=P.dates.map(function(d,i){return [dn(d),fl[i]]}),
      dv=[];for(var i=0;i<n-1;i++)dv.push([dn(P.dates[i]),vol(i+1,k)-vol(i,k)]);
  var over=fl.filter(function(v){return v>100}).length,mx=Math.max.apply(null,fl),mi=fl.indexOf(mx),x0=pts[0][0],x1=pts[n-1][0];
  var ref=0.09*cap(k),big=dv.filter(function(p){return Math.abs(p[1])>=ref}).length,bw=null;
  for(var a=0;a+11<n;a++){var rs=vol(a+11,k)-vol(a,k);if(bw===null||rs>bw.v)bw={v:rs,a:P.dates[a],b:P.dates[a+11]}}
  var h='<div class="cards"><div class="card"><div class="lab">'+t('k_cur')+'</div><div class="val">'+nf(fl[n-1],1)+'%</div><div class="sm">'+fd(P.dates[n-1])+'</div></div>'+
   '<div class="card"><div class="lab">'+t('k_max')+'</div><div class="val">'+nf(mx,1)+'%</div><div class="sm">'+fd(P.dates[mi])+'</div></div>'+
   '<div class="card"><div class="lab">'+t('k_days')+'</div><div class="val">'+over+' / '+n+'</div></div>'+
   '<div class="card"><div class="lab">'+t('k_big')+'</div><div class="val">'+big+' / '+dv.length+'</div><div class="sm">'+nf(big/dv.length*100,1)+'%</div></div>'+
   '<div class="card"><div class="lab">'+t('k_rise')+'</div><div class="val">'+sg(bw.v,1)+' hm³</div><div class="sm">'+fd(bw.a)+' → '+fd(bw.b)+'</div></div></div>'+
   '<div class="panel"><h2>'+t('k_title')+'</h2>'+chart({w:680,h:240,x0:x0,x1:x1,yf:function(v){return nf(v)+'%'},xt:monthTicks(x0,x1),hlines:[{y:100,l:t('k_ref'),under:true}],vline:dn(S.date),series:[{cls:'s1',pts:pts}]})+'</div>'+
   '<div class="panel"><h2>'+t('k_dv')+'</h2>'+chart({w:680,h:200,x0:x0,x1:x1,zero:true,yf:function(v){return nf(v,1)},xt:monthTicks(x0,x1),hlines:[{y:4.77,l:'+4,8'},{y:-4.77,l:'-4,8',under:true}],series:[{type:'bar',cls:'b1',pts:dv}]})+'</div><p class="note">'+t('k_note')+'</p>';
  $('#t-kast').innerHTML=h}

function renderMeth(){
  $('#mmc').innerHTML='<div class="hd"><h2>'+t('m_title')+'</h2><button id="mclose">'+t('close')+'</button></div>'+t('m').map(function(p){return '<p>'+p+'</p>'}).join('');
  $('#mclose').onclick=function(){$('#mm').hidden=true}}
function banner(){
  var d=P.idx.Days.filter(function(x){return x.Date===S.date})[0],msg=[],lab={reservoir:S.lang==='el'?'ταμιευτήρες':'reservoirs',scada:'SCADA',isp:'ISP',resmv:'RESMV',mcp:'MCP'};
  if(d&&d.Status){var miss=Object.keys(d.Status).filter(function(k){return d.Status[k]!=='ok'}).map(function(k){return lab[k]});if(miss.length)msg.push(t('q_missing',{x:miss.join(', ')}))}
  P.notes.forEach(function(n){if(S.date>=n.from&&S.date<=n.to)msg.push(t('q_zero',{x:dname(n.key)+' '+fd(n.from)+' → '+fd(n.to)}))});
  $('#banner').innerHTML=msg.map(function(m){return '<div class="b">'+m+'</div>'}).join('')}
function chrome(){
  document.documentElement.lang=S.lang;document.title=t('ttl');$('#ttl').textContent=t('ttl');$('#sub').textContent=t('sub');$('#dlab').textContent=t('date');
  $('#lang').textContent=S.lang==='el'?'EN':'ΕΛ';$('#meth').textContent=t('meth');
  $('#tabs').innerHTML=['rivers','energy','pump','wb','kast'].map(function(k){return '<button data-t="'+k+'" class="'+(S.tab===k?'on':'')+'">'+t('t_'+k)+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');chrome();showTab()}});
  var sel=$('#dsel'),cur=S.date;sel.innerHTML=P.idx.Days.map(function(x){var ok=x.Status&&x.Status.scada==='ok';return '<option value="'+x.Date+'"'+(x.Date===cur?' selected':'')+'>'+fd(x.Date)+(ok?'':' *')+'</option>'}).join('')}
function showTab(){['rivers','energy','pump','wb','kast'].forEach(function(k){$('#t-'+k).hidden=S.tab!==k})}
function load(date){
  S.date=date;
  return getJSON('days/'+date+'.json').catch(function(){return null}).then(function(rec){
    S.rec=rec||{Hourly:[]};S.M=model(date,S.rec);banner();cardsSummary(S.M,S.rec);cardsRivers(S.M);$('#rfoot').textContent=t('click');renderEnergy();renderPump();renderWB();renderKast();renderMeth();chrome();showTab()})}

function boot(){
  Promise.all([getJSON('index.json'),getJSON('reservoirs.json'),getJSON('energy_factors.json'),getJSON('reservoir_history.json'),opt('plant_heads.json'),opt('entsoe_reservoir.json'),opt('pump_daily.json'),opt('water_balance.json')]).then(function(a){
    P.idx=a[0];P.meta=a[1];P.fac=a[2];P.hist=a[3];P.heads=a[4];P.ent=a[5];P.wb=a[7];P.pump=a[6]||[];P.pm={};P.pump.forEach(function(x){P.pm[x.Date]=x});sanitize();physE();
    var pick=P.idx.Days.filter(function(x){return x.Status&&x.Status.scada==='ok'&&x.Status.isp==='ok'})[0]||P.idx.Days[0];
    $('#dsel').onchange=function(){load(this.value)};
    $('#lang').onclick=function(){S.lang=S.lang==='el'?'en':'el';try{localStorage.setItem('bh_lang',S.lang)}catch(e){}load(S.date)};
    $('#meth').onclick=function(){$('#mm').hidden=false};
    $('#rm').onclick=function(e){if(e.target===this)this.hidden=true};$('#mm').onclick=function(e){if(e.target===this)this.hidden=true};
    return load(pick.Date)}).catch(function(e){document.querySelector('main').innerHTML='<div class="panel">'+t('err')+'<br><span class="mut small">'+(e&&e.message||e)+'</span></div>';if(window.console)console.error(e)})}
window.__bh={P:P,S:S,model:model,eqE:eqE,boot:boot,load:load,openRiver:openRiver};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
